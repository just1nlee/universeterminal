name: Deploy Lambda (universeterminal-prod-bedrock-inference)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for OIDC
      contents: read # Needed to checkout repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./lambda/universeterminal-prod-bedrock-inference
        run: npm install --production

      - name: Create deployment package
        working-directory: ./lambda/universeterminal-prod-bedrock-inference
        run: zip -r lambda-package.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::219268920150:role/universeterminal-github-actions-lambda-deploy-role
          aws-region: us-west-2

      - name: Deploy to AWS Lambda
        working-directory: ./lambda/universeterminal-prod-bedrock-inference
        run: |
          aws lambda update-function-code \
            --function-name universeterminal-prod-bedrock-inference \
            --zip-file fileb://lambda-package.zip
